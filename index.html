<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxHub</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}body{background:linear-gradient(135deg,#2d0a6b,#6b21a8 60%,#7c3aed);color:#fff}.wrap{max-width:1400px;margin:auto}.header{text-align:center;padding:14px;font-size:22px;font-weight:bold;background:rgba(80,20,160,.45)}.section{margin:18px 8px 8px;font-size:18px;font-weight:700;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.15)}.box{margin:12px 8px;background:rgba(70,20,140,.45);padding:14px;border-radius:8px}.box h2{font-size:16px;margin-bottom:8px}pre{font-size:13px;border-radius:6px;overflow:auto}button{font-size:14px;border-radius:6px}@media(max-width:700px){.header{font-size:20px}.section{font-size:16px}.box h2{font-size:15px}pre{font-size:12px}button{font-size:13px}}pre{background:#050505;padding:10px}button{width:100%;margin-top:12px;padding:10px;background:linear-gradient(90deg,#8a18d6,#4f7df5);color:#fff;border:none}</style></head><body><div class='wrap'><div class='header'>🪐 Galaxy Script Hub</div>

<div class='section'>🔫 Murder Mystery 2 🔪</div>

<div class='box'><h2>🦊 FoxName</h2><pre id='foxname'>loadstring(game:HttpGet("https://raw.githubusercontent.com/mm2foxhub/foxname/refs/heads/main/lua"))()</pre><button onclick="copyText('foxname',this)">Copy Script</button></div>

<script>
function copyText(id,b){
const t=document.getElementById(id).innerText;
navigator.clipboard.writeText(t).then(()=>{
let o=b.innerText;
b.innerText='Copied ✓';
setTimeout(()=>b.innerText=o,1500);
});
}
</script>

</div></body></html>
